<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <title>物理ギミック連動テスト</title>
  <style>
    body { font-family: sans-serif; text-align: center; padding: 50px; }
    button { padding: 10px 20px; font-size: 16px; margin: 10px; cursor: pointer; }
    #gameArea { display: none; margin-top: 30px; padding: 20px; border: 2px solid #333; }
    .hidden-message { color: red; font-size: 24px; font-weight: bold; }
  </style>
</head>
<body>

  <h1>PC連動システム テスト</h1>
  <button id="connectBtn">Arduinoと接続する</button>

  <div id="gameArea">
    <h2>【ミッション】<br>4番ピンから伸びているワイヤーを、GNDに接続せよ！</h2>
    <p id="statusMessage">配線を待機中...</p>
    <hr>
    <h3>Webから物理ライトを操作するテスト</h3>
    <button id="ledOnBtn">ライトを点灯 (Aを送信)</button>
    <button id="ledOffBtn">ライトを消灯 (Bを送信)</button>
  </div>

  <script>
    let port;
    let writer;

    document.getElementById('connectBtn').addEventListener('click', async () => {
      try {
        port = await navigator.serial.requestPort();
        await port.open({ baudRate: 9600 }); 
        
        document.getElementById('connectBtn').style.display = 'none';
        document.getElementById('gameArea').style.display = 'block';
        
        writer = port.writable.getWriter();
        readLoop(); 
      } catch (e) {
        console.error("接続エラー:", e);
        alert("接続エラーが発生しました。");
      }
    });

    // ★ここを強化しました！（細切れの文字をバケツに貯める作戦）
    async function readLoop() {
      const reader = port.readable.getReader();
      const decoder = new TextDecoder();
      let buffer = ""; // 文字を貯めておくバケツ

      try {
        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          
          buffer += decoder.decode(value); // 届いた文字をバケツに追加
          
          // バケツの中に「CONNECTED」が揃ったら！
          if (buffer.includes("CONNECTED")) {
            const statusObj = document.getElementById('statusMessage');
            statusObj.innerHTML = "配線完了！！<br>次のステージへ遷移します...（という演出）";
            statusObj.className = "hidden-message";
            buffer = ""; // 反応したらバケツを空にする
          }
        }
      } catch (e) {
        console.error("読み取りエラー:", e);
      } finally {
        reader.releaseLock();
      }
    }

    async function sendCommand(cmd) {
      if (writer) {
        const encoder = new TextEncoder();
        await writer.write(encoder.encode(cmd));
      }
    }

    document.getElementById('ledOnBtn').addEventListener('click', () => sendCommand('A'));
    document.getElementById('ledOffBtn').addEventListener('click', () => sendCommand('B'));
  </script>

</body>
</html>
