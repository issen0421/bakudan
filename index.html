<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>【極秘】ハッキングポータル</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="app">
        <!-- ヘッダー -->
        <header>
            <div class="tabs">
                <button class="tab-btn active" onclick="switchTab('mailer')">M-MAIL</button>
                <button class="tab-btn" onclick="switchTab('c123-make')">C-123制作ソフト</button>
                <button class="tab-btn hidden" id="tab-c123-stop" onclick="switchTab('c123-stop')">C-123停止ソフト</button>
            </div>
            <div id="timer" class="hidden">10:00</div>
        </header>

        <!-- メーラータブ -->
        <div id="mailer" class="tab-content active">
            <h2>受信トレイ</h2>
            <div id="mail-list">
                <!-- メールがJSで追加されます -->
            </div>
            <div id="mail-body" class="hidden">
                <h3 id="mail-title"></h3>
                <p id="mail-text"></p>
                <button onclick="closeMail()">閉じる</button>
            </div>
        </div>

        <!-- 制作ソフトタブ -->
        <div id="c123-make" class="tab-content">
            <h2>C-123 ハッキングモジュール アセンブラ</h2>
            <div id="step1-box" class="step-box">
                <h3>ファイル①：ライト制御プロトコル</h3>
                <input type="text" id="pass1" placeholder="パスワードを入力">
                <button onclick="checkPass(1)">ダウンロード</button>
                <p id="msg1" class="msg"></p>
            </div>
            <div id="step2-box" class="step-box hidden">
                <h3>ファイル②：音響バイパスモジュール</h3>
                <input type="text" id="pass2" placeholder="パスワードを入力">
                <button onclick="checkPass(2)">ダウンロード</button>
                <p id="msg2" class="msg"></p>
            </div>
            <div id="step3-box" class="step-box hidden">
                <h3>ファイル③：7セグメント解析キー</h3>
                <input type="text" id="pass3" placeholder="パスワードを入力">
                <button onclick="checkPass(3)">ダウンロード</button>
                <p id="msg3" class="msg"></p>
            </div>
        </div>

        <!-- 停止ソフトタブ -->
        <div id="c123-stop" class="tab-content">
            <h2>C-123 緊急停止コンソール</h2>
            <div id="stop-step1">
                <p>解除のための4つの謎の答えを入力せよ。（※プロトタイプ用：ここでは「解除」と入力）</p>
                <input type="text" id="stop-pass" placeholder="答えを入力">
                <button onclick="unlockStopStep2()">解析</button>
            </div>
            <div id="stop-step2" class="hidden">
                <h3 class="danger-text">【警告】手順2</h3>
                <p>光らなかったライトが本来光るべきタイミングで、メインコードを切断せよ。</p>
                <div class="light-sim">
                    <div id="sim-light" class="light"></div>
                    <p>※手元の基板のシミュレーション</p>
                </div>
                <button id="cut-btn" onclick="cutCode()">✂️ コードを切断する</button>
            </div>
        </div>

        <!-- ポップアップモーダル -->
        <div id="modal" class="modal">
            <div class="modal-content">
                <h2 id="modal-title">通信傍受</h2>
                <p id="modal-text">ここにメッセージが入ります</p>
                <button id="modal-btn" onclick="closeModal()">了解</button>
            </div>
        </div>
        
        <!-- 記事モーダル (エンディング) -->
        <div id="article-modal" class="modal hidden">
            <div class="modal-content article">
                <h2 id="article-title"></h2>
                <p id="article-text"></p>
                <button id="retry-btn" class="hidden" onclick="location.reload()">予備コードを繋いで再挑戦</button>
            </div>
        </div>
    </div>
    <script src="main.js"></script>
</body>
</html>
